[project]
name = "deep-traffic-generation-paper"
version = "0.2.0"
description = "Simplified plain-torch reimplementation of the deep traffic generation paper."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch>=2.5",
    "traffic>=2.10",
    "cartes",
    "pitot",
    "scikit-learn",
    "pandas",
    "numpy",
    "matplotlib",
    "altair",
    "pyyaml",
    "rich",
]

[tool.setuptools.packages.find]
include = ["dtg*"]
