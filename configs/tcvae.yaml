data:
  path: data/traffic_noga_tilFAF_train.pkl
  features: [track, groundspeed, altitude, timedelta]
  info_features: [latitude, longitude]
  info_index: -1
  shape: image             # TCVAE wants (channels, seq_len)
  batch_size: 128
  train_ratio: 0.8
  val_ratio: 0.2
  num_workers: 0

model:
  h_channels: [64, 64, 64] # TCN channel sizes per residual block
  latent_dim: 64
  kernel_size: 16
  dilation_base: 2
  sampling_factor: 10      # avg-pool factor inside the encoder
  n_pseudo_inputs: 1000    # VampPrior mixture components
  dropout: 0.0

training:
  epochs: 1000                # smoke value; ~1000 for real training
  lr: 0.001
  lr_step: 200
  lr_gamma: 0.5
  grad_clip: 0.5
  kl_weight: 1.0
  device: auto
  seed: 42

checkpoint:
  out: checkpoints/tcvae.pt
