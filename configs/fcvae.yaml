data:
  path: data/traffic_noga_tilFAF_train.pkl
  features: [track, groundspeed, altitude, timedelta]
  info_features: [latitude, longitude]
  info_index: -1
  shape: linear            # FCVAE flattens the time axis
  batch_size: 500
  train_ratio: 0.8
  val_ratio: 0.2
  num_workers: 0

model:
  h_dims: [216, 128, 64]   # encoder hidden layers; decoder mirrors
  latent_dim: 64
  dropout: 0.0

training:
  epochs: 1                # smoke value; bump to ~1000 for real training
  lr: 0.001
  lr_step: 200
  lr_gamma: 0.5
  grad_clip: 0.5
  kl_weight: 1.0
  device: auto             # cuda > mps > cpu
  seed: 42

checkpoint:
  out: checkpoints/fcvae.pt
